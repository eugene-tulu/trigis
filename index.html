<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1b2a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .container {
    text-align: center;
    padding: 2rem;
    max-width: 560px;
  }
  h1 {
    font-size: 3rem;
    color: #f9a825;
    margin-bottom: 0.5rem;
  }
  p {
    font-size: 1.2rem;
    color: #b0bec5;
    margin-bottom: 1.5rem;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #1a2e44;
    border-top-color: #f9a825;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    margin-top: 2rem;
    font-size: 0.85rem;
    color: #546e7a;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Site Under Maintenance</h1>
    <p>We're currently making improvements. We'll be back shortly.</p>
    <footer>Contact us: info@trigis.com</footer>
  </div>
</body>
</html>
